<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance - {{ site_settings.site_name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .maintenance-card {
            max-width: 600px;
            padding: 3rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .icon-box {
            font-size: 4rem;
            color: #ffc107;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="maintenance-card mx-auto">
            <div class="icon-box">
                <i class="fas fa-tools"></i>
            </div>
            <h1 class="fw-bold mb-3">Under Maintenance</h1>
            <p class="lead text-muted mb-4">
                We are currently performing scheduled maintenance to improve our services.
                <br>Please check back soon.
            </p>
            {% if site_settings.site_name %}
            <p class="text-secondary small">&copy; {{ site_settings.site_name }}</p>
            {% endif %}
            
            <div class="mt-4">
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Administrator Login</a>
            </div>
        </div>
    </div>
</body>
</html>
