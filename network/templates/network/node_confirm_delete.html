{% extends 'layouts/base.html' %}

{% block title %}Delete Node - NMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-danger text-white py-3">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-exclamation-triangle me-2"></i> Confirm Deletion</h6>
            </div>
            <div class="card-body text-center py-5">
                <i class="fas fa-trash-alt fa-3x text-danger mb-3"></i>
                <h4 class="text-dark fw-bold">Delete {{ node.name }}?</h4>
                <p class="text-muted mb-4">Are you sure you want to delete this network node? This action cannot be undone.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'network_node_list' %}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Node</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
