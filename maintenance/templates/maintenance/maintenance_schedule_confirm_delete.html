{% extends 'layouts/base.html' %}

{% block title %}Delete Schedule - ITMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 border-start border-danger border-4">
            <div class="card-body p-4 text-center">
                <div class="mb-3">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger"></i>
                </div>
                <h4 class="fw-bold text-dark">Confirm Deletion</h4>
                <p class="text-muted">
                    Are you sure you want to delete the maintenance schedule <strong>"{{ object.title }}"</strong>?
                    <br>This action cannot be undone.
                </p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'maintenance_schedule_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fas fa-trash me-2"></i>Delete Schedule
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
