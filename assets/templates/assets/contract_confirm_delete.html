{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Delete Contract{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-danger border-4">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-danger">
                    <i class="fas fa-exclamation-circle fa-4x"></i>
                </div>
                <h3 class="mb-3">Are you sure?</h3>
                <p class="text-muted mb-4">
                    Do you really want to delete the contract <strong>"{{ object.title }}"</strong>?
                    <br>This process cannot be undone.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'contract_list' %}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Contract</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
