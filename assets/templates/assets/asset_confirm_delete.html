{% extends "layouts/base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-header bg-danger text-white py-3 border-0 d-flex align-items-center justify-content-between">
                    <div>
                        <h5 class="mb-0 fw-bold">{{ title|default:"Confirm Deletion" }}</h5>
                    </div>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle text-danger fs-1 opacity-50 mb-3"></i>
                        <h5 class="fw-bold text-gray-800">Are you sure?</h5>
                        <p class="text-muted">This action cannot be undone. Do you really want to delete this record?</p>
                        {% if object %}
                        <div class="alert alert-light border mt-3">
                            <strong>{{ object }}</strong>
                        </div>
                        {% endif %}
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-center">
                            <a href="{% url 'asset_detail' asset.pk %}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
