<div class="card mb-2 shadow-sm border-start border-{{ color }} border-3">
    <div class="card-body p-2">
        <div class="d-flex justify-content-between mb-1">
            <span class="badge bg-light text-muted border" style="font-size: 0.7rem;">Task</span>
            {% if task.due_date %}
            <small class="{% if task.is_past_due %}text-danger fw-bold{% else %}text-muted{% endif %}" style="font-size: 0.75rem;">
                <i class="far fa-clock me-1"></i>{{ task.due_date|date:"d M" }}
            </small>
            {% endif %}
        </div>
        
        <h6 class="card-title mb-1 small fw-bold text-dark">
            <a href="#" class="text-decoration-none text-dark stretched-link"
               data-bs-toggle="modal" 
               data-bs-target="#taskDetailModal"
               data-task-name="{{ task.name }}"
               data-task-desc="{{ task.description|default:'No description provided.' }}"
               data-task-due="{{ task.due_date|date:'d M Y'|default:'-' }}"
               data-task-status="{{ task.status }}"
               data-task-assignee="{{ task.assigned_to.first_name|default:'Unassigned' }}">
                {{ task.name|truncatechars:40 }}
            </a>
        </h6>
        
        <p class="mb-2 text-muted small" style="font-size: 0.8rem; line-height: 1.2;">
            {{ task.description|truncatechars:60 }}
        </p>
        
        <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-1">
            <div class="d-flex align-items-center">
                {% if task.assigned_to %}
                <div class="avatar-xxs bg-soft-primary text-primary rounded-circle d-flex align-items-center justify-content-center me-1 border" style="width:20px;height:20px;font-size:0.7rem;" title="{{ task.assigned_to.first_name }}">
                    {{ task.assigned_to.first_name.0|upper }}
                </div>
                {% else %}
                <span class="text-muted" style="font-size: 0.7rem;">-</span>
                {% endif %}
            </div>
            
            {% if can_edit or user == task.assigned_to %}
            <div class="dropdown no-arrow position-static">
                <a class="text-muted" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="position: relative; z-index: 2;">
                    <i class="fas fa-ellipsis-h fa-sm"></i>
                </a>
                <ul class="dropdown-menu shadow">
                    <li>
                        <button class="dropdown-item small" 
                                data-bs-toggle="modal" 
                                data-bs-target="#completionModal"
                                data-task-id="{{ task.pk }}"
                                data-task-name="{{ task.name }}">
                                <i class="fas fa-check text-success me-2"></i>Mark Done
                        </button>
                    </li>
                </ul>
            </div>
            {% endif %}
        </div>
    </div>
</div>
