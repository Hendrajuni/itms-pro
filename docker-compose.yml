services:
  # 1. APLIKASI DJANGO
  web:
    build:
      context: .
      network: host
    network_mode: "host"
    command: gunicorn config.wsgi:application --bind 127.0.0.1:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=127.0.0.1
    depends_on:
      - db
    restart: always

  # 2. WEBSERVER (NGINX) - Pintu Masuk (Port 80)
  nginx:
    image: nginx:1.25-alpine
    network_mode: "host"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

  # 3. DATABASE (POSTGRESQL)
  db:
    image: postgres:15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
