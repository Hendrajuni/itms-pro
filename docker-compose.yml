services:
  # 1. APLIKASI DJANGO
  web:
    build:
      context: .
      network: host
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    # ports:
    #   - "8000:8000"  <-- SAYA KOMENTARI (MATIKAN) AGAR LEWAT NGINX SAJA
    expose:
      - "8000" # Hanya buka akses untuk Nginx, bukan ke publik
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db # Wajib ada agar Docker connect ke db (karena default settings.py = localhost)
    depends_on:
      - db
    restart: always

  # 2. WEBSERVER (NGINX) - Pintu Masuk (Port 80)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80" # <--- Akses Publik via Port 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

  # 3. DATABASE
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
