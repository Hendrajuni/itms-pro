{% extends 'layouts/base_auth.html' %}

{% block title %}Server Error - ITMS{% endblock %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center vh-100 text-center">
    <div class="mb-4">
        <i class="fas fa-server text-danger" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-1 fw-bold text-dark">500</h1>
    <h2 class="h4 mb-4 text-muted">Internal Server Error</h2>
    <p class="lead mb-5 text-secondary" style="max-width: 500px;">
        Something went wrong on our end. Please try again later or contact the IT department if the problem persists.
    </p>
    <a href="/" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
        <i class="fas fa-redo me-2"></i>Try Again
    </a>
</div>
{% endblock %}
